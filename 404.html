<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı — Simya Analiz</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#6C5B4B" />
  <style>
    :root {
      --primary: #6C5B4B;
      --accent:  #A89482;
      --bg:      #FBF9F8;
      --surface: #F5F3F3;
      --border:  #E8E4E0;
      --text:    #2C2420;
      --muted:   #8C7B72;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F0D0C; --surface: #1A1614; --border: #2E2824;
        --text: #EDE9E6; --muted: #8A7870; --primary: #C4A68C;
      }
    }

    nav {
      background: rgba(251,249,248,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(15,13,12,0.9); }
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 16px;
      color: var(--primary); text-decoration: none;
    }
    .brand-icon {
      width: 32px; height: 32px; background: var(--primary);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 18px; height: 18px; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }

    .code {
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -4px;
      color: var(--surface);
      line-height: 1;
      margin-bottom: 8px;
      user-select: none;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 380px;
      margin-bottom: 36px;
    }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff;
      text-decoration: none; padding: 13px 26px;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      transition: opacity .15s;
    }
    a.btn:hover { opacity: .85; }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 52 52" fill="none">
        <path d="M20 8V22L10 38C8.5 40.5 10.2 44 13 44H39C41.8 44 43.5 40.5 42 38L32 22V8" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 8H34" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
    Simya Analiz
  </a>
</nav>

<main>
  <div class="code">404</div>
  <div class="icon">⚗️</div>
  <h1>Bu sayfa bulunamadı</h1>
  <p>Aradığın sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Ama uygulamamız burada!</p>
  <a href="/" class="btn">← Ana Sayfaya Dön</a>
</main>

<footer>© 2026 Simya Analiz</footer>

</body>
</html>
